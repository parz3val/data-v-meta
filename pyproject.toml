[project]
name = "wqa"
version = "1.0.0"
description = "Predicting Wikipedia article quality from metadata: pipeline, models and demo app (MSc dissertation, London Metropolitan University, 2026)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6", "requests>=2.32", "structlog>=24", "pandas>=2.2", "pyarrow>=16",
  "mwparserfromhell>=0.6", "scikit-learn>=1.5", "duckdb>=1.0", "scipy>=1.13",
  "xgboost>=2", "lightgbm>=4", "catboost>=1.2", "optuna>=3.6", "shap>=0.46", "matplotlib>=3.9",
  "flask>=3",
]
[project.optional-dependencies]
enc = ["torch>=2.4", "transformers>=4.44", "accelerate>=0.33"]
dev = ["pytest>=8", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/wqa"]
